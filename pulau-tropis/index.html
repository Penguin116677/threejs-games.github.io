<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8e8">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pulau Tropis</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <canvas id="game"></canvas>

  <div id="loading">
    <div class="judul">Pulau Tropis</div>
    <div id="loading-teks">Memuat pulau…</div>
  </div>

  <div id="hud" hidden>
    <div class="hud-kiri">
      <div class="hud-judul">Pulau Tropis <span>· Milestone 3</span></div>
      <div id="fps">-- FPS</div>
      <div id="nyawa" aria-label="Nyawa"><div class="isi"></div><span class="angka">100</span></div>
      <div id="koin" class="koin-pill" aria-label="Koin"></div>
    </div>
    <div class="hud-kanan">
      <button id="btn-kualitas" type="button">Kualitas</button>
      <button id="btn-layar-penuh" type="button">Layar penuh</button>
      <button id="btn-mode" type="button">Lihat pulau</button>
      <div class="hud-baris">
        <button id="btn-peta" type="button" aria-label="Peta" title="Peta (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 6.1 8.6 3.9l6.8 2.4 5.8-2.2v13.8l-5.8 2.2-6.8-2.4-5.8 2.2z" fill="#f4ecd8" /><path d="M8.6 3.9v13.8M15.4 6.3v13.8" stroke="#b9a882" stroke-width="1.2" /><path d="M4.6 15.6c1.6-1.4 3-1.2 4.6-.2s3.2 1.1 4.4-.6" fill="none" stroke="#d9573c" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.5 1.6" /><path d="M17.9 7.4a2.4 2.4 0 0 1 2.4 2.4c0 1.8-2.4 4.3-2.4 4.3s-2.4-2.5-2.4-4.3a2.4 2.4 0 0 1 2.4-2.4z" fill="#d9573c" /><circle cx="17.9" cy="9.8" r=".9" fill="#f4ecd8" /></svg>
        </button>
        <button id="btn-tas" type="button">Tas</button>
      </div>
    </div>
    <div id="joystick" hidden><div class="kenop"></div></div>
    <!-- tombol aksi sesuai keadaan (dekat kios, dekat orang, di tepi air, …) -->
    <div id="aksi-konteks">
      <button id="btn-belanja" type="button" hidden></button>
    </div>
    <button id="btn-pukul" class="aksi" type="button" aria-label="Pukul (kombo)" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path transform="rotate(45 12 12)" d="M12 1.5 13.5 4v11h-3V4zM7 15h10v2H7zm4 2h2v4h-2zm-.75 4h3.5v2h-3.5z" /></svg>
      <span>Pukul</span>
    </button>
    <button id="btn-cincang" class="aksi jurus siap" type="button" aria-label="Jurus 1: Cincang 10 kali" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13 13 4M6.5 17.5 17.5 6.5M11 20l9-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" /></svg>
      <span>Cincang</span>
      <b class="cd"></b>
    </button>
    <button id="btn-hentak" class="aksi jurus siap" type="button" aria-label="Jurus 2: Hentak tancap" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path transform="translate(0 -1.5) rotate(180 12 12) scale(.85) translate(2.1 2.1)" d="M12 1.5 13.5 4v11h-3V4zM7 15h10v2H7zm4 2h2v4h-2zm-.75 4h3.5v2h-3.5z" /><path d="M3 21.5h18M5.5 18l2.2 1.6M18.5 18l-2.2 1.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" /></svg>
      <span>Hentak</span>
      <b class="cd"></b>
    </button>
    <button id="btn-putar" class="aksi jurus siap" type="button" aria-label="Jurus 3: Cincang lalu putar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12A7.5 7.5 0 1 1 17.7 7.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" /><path d="M19.4 9.2 15.3 8.4 19.3 5z" /></svg>
      <span>Putar</span>
      <b class="cd"></b>
    </button>
    <button id="btn-penggal" class="aksi jurus pamungkas siap" type="button" aria-label="Jurus 4: Penggal lima leher" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="2" /><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" /><path d="M5 19 19 5" fill="none" stroke="#ff9a8a" stroke-width="2.4" stroke-linecap="round" /></svg>
      <span>Penggal</span>
      <b class="cd"></b>
    </button>
    <button id="btn-lompat" class="aksi" type="button" aria-label="Lompat" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 20 12h-5v8.5H9V12H4z" /></svg>
      <span>Lompat</span>
    </button>
    <div id="gelembung"></div>
    <div id="pesan" hidden></div>
    <div id="panel-kualitas" hidden>
      <div class="panel-judul">Kualitas grafis</div>
      <button type="button" data-q="rendah">Rendah <small>paling ringan, tanpa bayangan</small></button>
      <button type="button" data-q="sedang">Sedang <small>bayangan + rumput (disarankan untuk HP)</small></button>
      <button type="button" data-q="tinggi">Tinggi <small>paling detail, untuk HP kuat / komputer</small></button>
      <button type="button" id="btn-tutup-kualitas" class="tutup">Tutup</button>
    </div>
    <div id="saran" hidden>Terasa berat? Ketuk <b>Kualitas</b> lalu pilih <b>Rendah</b>.</div>
    <div id="petunjuk"></div>
    <div id="wilayah"><div class="wilayah-nama"></div><div class="wilayah-ket"></div></div>
    <div id="kartu-elf" hidden></div>
    <div id="toko" class="panel-layar" hidden>
      <div class="toko-kartu">
        <div class="toko-kepala">
          <div><div class="panel-judul" id="toko-judul">Kios</div><div class="toko-sub" id="toko-penjual"></div></div>
          <div class="koin-pill" id="toko-koin"></div>
        </div>
        <div class="toko-daftar" id="toko-daftar"></div>
        <div class="toko-kaki"><span id="toko-pesan"></span><button type="button" id="btn-tutup-toko" class="tutup">Tutup</button></div>
      </div>
    </div>
    <div id="tas" class="panel-layar" hidden>
      <div class="toko-kartu">
        <div class="toko-kepala">
          <div><div class="panel-judul">Tas</div><div class="toko-sub">Bekal, ramuan &amp; perlengkapanmu</div></div>
          <div class="koin-pill" id="tas-koin"></div>
        </div>
        <div class="tas-efek" id="tas-efek"></div>
        <div class="toko-daftar" id="tas-daftar"></div>
        <div class="toko-kaki"><span id="tas-pesan"></span><button type="button" id="btn-tutup-tas" class="tutup">Tutup</button></div>
      </div>
    </div>
    <div id="peta" hidden>
      <div class="peta-kartu">
        <div class="panel-judul">Peta Dunia</div>
        <canvas id="peta-kanvas"></canvas>
        <div class="peta-kaki">
          <span><b class="titik kamu"></b> kamu · <b class="titik orc"></b> perkemahan orc · <b class="titik toko"></b> toko · <b class="titik perahu"></b> perahumu</span>
          <button type="button" id="btn-tutup-peta" class="tutup">Tutup</button>
        </div>
      </div>
    </div>
  </div>
  <div id="luka"></div>
  <div id="tirai"></div>

  <div id="error" hidden>
    <div class="judul">Terjadi masalah</div>
    <pre id="error-teks"></pre>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
